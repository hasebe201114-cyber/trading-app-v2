name: OBS000041 BTC_USDC Liquidity Probe (One-off, non-gated)

# EXP-OBS000041 追加調査（research/EXP-OBS000041/00-spec-stage0.md のG0-E1に対する軽い追加調査）。
# G0-E1がE1-POSITIVE相当の結果（btc_usdc系列・最小ロットvegaがBTC標準の1/10）を出したことを受け、
# 司令塔指示「BTC_USDCの流動性を確認する価値があるか、まず確認してほしい」に基づき、
# 板の厚み・全ストライク/全満期の建玉分布・直近約定履歴・スプレッド実態を実測する。
#
# ⚠ 新たな判定ゲートではない。schedule（cron）は設定しない＝一回限りの探索的計算。
#   手動実行（workflow_dispatch）のみ。Secrets/環境変数は使わない
#   （Deribit publicエンドポイントは認証不要）。
# ⚠ research/EXP-OBS000037/ 配下には一切書き込まない（本ワークフローも触れない）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to run without committing results"
        required: false
        default: "false"

jobs:
  btc-usdc-liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # 結果をコミット・push するために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show runner IP (diagnostic only)
        run: curl -s https://api.ipify.org || true

      - name: Run BTC_USDC liquidity probe (one-off, non-gated)
        run: |
          node --experimental-strip-types scripts/probe-btc-usdc-liquidity.ts

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ⚠ 変更検出は git status --porcelain 方式を使う（git diff --quiet <未追跡ファイル> は
          # 新規（未追跡）ファイルの差分を検出できずcommitをスキップしてしまうバグを踏んだ前例がある
          # （obs000037-eth-reference-oneoff.yml run 30182740505・commit 13aeed4で是正済みのパターン）。
          # 初回実行時、本ワークフローの成果物はすべて未追跡ファイルであるため、同じ確立済みパターンを踏襲する。
          RESULT_PATHS="research/EXP-OBS000041/10-result/btc-usdc-liquidity.json research/EXP-OBS000041/10-result/btc-usdc-liquidity-run.log"

          if [ -z "$(git status --porcelain $RESULT_PATHS)" ]; then
            echo "No changes to BTC_USDC liquidity probe results — skipping commit"
          else
            git add $RESULT_PATHS
            git commit -m "chore(obs000041): BTC_USDC liquidity probe (one-off) from GitHub Actions (US IP) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::git pull --rebase failed (conflict). Aborted rebase."
              exit 1
            fi
            git push origin main
            echo "Committed and pushed BTC_USDC liquidity probe results"
          fi

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs000041-btc-usdc-liquidity-${{ github.run_id }}
          path: |
            research/EXP-OBS000041/10-result/btc-usdc-liquidity.json
            research/EXP-OBS000041/10-result/btc-usdc-liquidity-run.log
          retention-days: 30
