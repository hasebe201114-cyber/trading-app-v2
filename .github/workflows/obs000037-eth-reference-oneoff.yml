name: OBS000037 ETH Reference (One-off, non-gated)

# ⚠ 一回限りの探索的計算。schedule（cron）は設定しない＝日次蓄積・ライブ較正ではない。
# OBS000037（BTC）本番実験のリスコープ外。手動実行（workflow_dispatch）のみ。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to run without committing results"
        required: false
        default: "false"

jobs:
  eth-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # 結果をコミット・push するために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ETH reference computation (one-off, non-gated)
        run: |
          node --experimental-strip-types scripts/vrp-eth-reference.ts

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ⚠ 初回実行時はeth-reference-vrp.json/run.logが未追跡（新規）ファイルのため、
          # 「git diff --quiet <path>」は追跡差分しか見ず新規ファイルを検出できずスキップしてしまう
          # バグを踏んだ（run 30182740505・成功したのにcommitされなかった）。
          # carry-executor-sync.ymlと同じ確立済みの是正パターン（git status --porcelain＝
          # 未追跡ファイルも拾う）で変更有無を判定する。
          if [ -z "$(git status --porcelain research/EXP-OBS000037/10-result/eth-reference-vrp.json research/EXP-OBS000037/10-result/eth-reference-run.log)" ]; then
            echo "No changes to ETH reference results — skipping commit"
          else
            git add research/EXP-OBS000037/10-result/eth-reference-vrp.json research/EXP-OBS000037/10-result/eth-reference-run.log
            git commit -m "chore(obs000037): ETH reference one-off computation — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::git pull --rebase failed (conflict). Aborted rebase."
              exit 1
            fi
            git push origin main
            echo "Committed and pushed ETH reference results"
          fi

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs000037-eth-reference-${{ github.run_id }}
          path: |
            research/EXP-OBS000037/10-result/eth-reference-vrp.json
            research/EXP-OBS000037/10-result/eth-reference-run.log
          retention-days: 30
