name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # FIREBASE_SERVICE_ACCOUNT シークレット未設定の間はデプロイをスキップする
      # （ビルド検証までは常に実施し、mainを赤くしない）
      - name: Check deploy secret
        id: check-secret
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT シークレットが未設定のためデプロイをスキップしました。リポジトリの Settings > Secrets and variables > Actions に登録してください。"
          fi

      - name: Deploy to Firebase Hosting (live)
        if: steps.check-secret.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: trading-app-v2-94de8
