name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # GitHub Actions が GITHUB_TOKEN で push した場合は push イベントが発火しない仕様のため、
  # データ更新ワークフロー（forward-calibration・obs000037・carry-executor-sync）の完了を
  # workflow_run で捕捉してデプロイをトリガーする。
  workflow_run:
    workflows:
      - "OBS000032 Forward Calibration (Daily)"
      - "OBS000037 VRP Forward Calibration (Daily)"
      - "Carry Executor Status Sync"
      - "SYS-FX012 FX Forward Test Sync (Weekly)"
    types:
      - completed
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          # 04a21ff のセキュリティ修正 (apiKey ハードコード削除) を受け、
          # VITE_FIREBASE_* を Actions 経由で注入する。
          # - VITE_FIREBASE_API_KEY: GitHub Secrets 必須 (Hasebe-san 作業: Settings > Secrets and variables > Actions > VITE_FIREBASE_API_KEY)
          # - VITE_FIREBASE_PROJECT_ID / VITE_FIREBASE_AUTH_DOMAIN: 公開情報 (Firebase Console で誰でも参照可能) なので固定値で OK
          # Secrets 未登録の間は build は通るが Firebase 認証が動かない (フォワード画面白い状態のまま)。
          # apiKey 登録後にこの workflow の再実行 (空 commit 等) で build を通す。
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: trading-app-v2-94de8
          VITE_FIREBASE_AUTH_DOMAIN: trading-app-v2-94de8.firebaseapp.com
        run: npm run build

      # FIREBASE_SERVICE_ACCOUNT シークレット未設定の間はデプロイをスキップする
      # （ビルド検証までは常に実施し、mainを赤くしない）
      - name: Check deploy secret
        id: check-secret
        env:
          # 複数行JSONを直接 ${{ }} でシェルに展開すると構文エラーになるため、必ずenv経由で参照する
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "デプロイ用シークレットを確認しました。"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT シークレットが未設定のためデプロイをスキップしました。リポジトリの Settings > Secrets and variables > Actions の「Repository secrets」に登録してください。"
          fi

      - name: Deploy to Firebase Hosting (live)
        if: steps.check-secret.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: trading-app-v2-94de8
